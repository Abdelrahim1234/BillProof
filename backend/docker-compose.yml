services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
      PRIVATE_DB_NAME: ${PRIVATE_DB_NAME:-billproof_private}
      PUBLIC_DB_NAME: ${PUBLIC_DB_NAME:-billproof_public}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_PRIVATE_DATABASE: ${MONGODB_PRIVATE_DATABASE:-billproof_private}
      MONGODB_PUBLIC_DATABASE: ${MONGODB_PUBLIC_DATABASE:-billproof_public}
      MONGODB_ALLOW_REMOTE: ${MONGODB_ALLOW_REMOTE:-false}
      MONGODB_CLEANUP_WRITES_ENABLED: ${MONGODB_CLEANUP_WRITES_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - billproof_store:/app/data/store
    command: >
      sh -c "uv run python scripts/seed.py &&
             uv run uvicorn billproof.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  billproof_store:
