[project]
name = "billproof"
version = "0.1.0"
description = "BillProof P0 backend and MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "mcp[cli]>=1.2,<2",
    "pypdf>=5.1,<6",
    "ijson>=3.3,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
]
anthropic = [
    "anthropic>=0.39,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: `Depends(...)` in a default argument is FastAPI's own idiom, not a bug.
# DTZ003/DTZ011: this codebase deliberately uses naive UTC datetimes
# throughout (consistent internal convention -- see models.py's `_now`).
# PLW1510: our subprocess.run() calls in tests assert on returncode
# explicitly on the next line, which is the check.
ignore = ["B008", "DTZ003", "DTZ011", "PLW1510"]
